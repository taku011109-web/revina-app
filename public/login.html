<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ReViNa ログイン</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f4f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: #5b4fcf;
      height: 54px;
      display: flex;
      align-items: center;
      padding: 0 20px;
    }
    .logo {
      color: white;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .card-title {
      font-size: 22px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 28px;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 15px;
      color: #1a1a2e;
      outline: none;
      background: #fafafa;
      transition: border-color 0.2s;
    }
    .field input:focus {
      border-color: #5b4fcf;
      background: white;
    }
    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      color: #dc2626;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      background: #5b4fcf;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn:active { opacity: 0.9; }
  </style>
</head>
<body>
  <header class="header">
    <span class="logo">ReViNa</span>
  </header>
  <div class="container">
    <div class="card">
      <div class="card-title">ログイン</div>
      <div class="card-sub">ReViNa 対応管理ツール</div>
      <form method="POST" action="/login">
        <div id="errorMsg" class="error" style="display:none">
          メールアドレスまたはパスワードが違います
        </div>
        <div class="field">
          <label>メールアドレス</label>
          <input type="email" name="email" placeholder="example@gmail.com" required autocomplete="email">
        </div>
        <div class="field">
          <label>パスワード</label>
          <input type="password" name="password" placeholder="パスワードを入力" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">ログイン</button>
      </form>
    </div>
  </div>
  <script>
    if (location.search.includes('error=1')) {
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
