<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ReViNa 対応ツール</title>
  <style>
    :root {
      --purple: #5b4fcf;
      --purple-dark: #4338ca;
      --green: #16a34a;
      --teal: #0891b2;
      --text: #1a1a2e;
      --sub: #64748b;
      --bg: #f4f4f8;
      --white: #ffffff;
      --border: #e5e7eb;
      --shadow: 0 1px 6px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    .header {
      background: var(--purple);
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo { color: white; font-size: 20px; font-weight: 800; }
    .back-btn {
      color: rgba(255,255,255,0.9);
      font-size: 13px; font-weight: 600;
      cursor: pointer; display: none;
      align-items: center; gap: 4px;
    }
    .logout-btn {
      color: rgba(255,255,255,0.85);
      font-size: 13px; font-weight: 600;
      text-decoration: none;
    }

    /* SCREENS */
    .screen { display: none; padding-bottom: 40px; }
    .screen.active { display: block; }

    /* HOME */
    .section-card {
      margin: 20px 16px 0;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .section-title {
      font-size: 14px; font-weight: 700;
      color: var(--text);
      padding: 18px 18px 12px;
    }
    .team-item {
      display: flex;
      align-items: center;
      padding: 15px 18px;
      border-top: 1px solid var(--border);
      cursor: pointer;
      gap: 14px;
      transition: background 0.15s;
    }
    .team-item:active { background: #f8f8fc; }
    .team-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; flex-shrink: 0;
    }
    .team-info { flex: 1; }
    .team-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .team-store { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .arrow { color: #c4c4d0; font-size: 18px; }

    /* FLOW SELECT */
    .flow-header {
      padding: 20px 16px 0;
    }
    .flow-team-name {
      font-size: 20px; font-weight: 800; color: var(--text);
    }
    .flow-store-name {
      font-size: 13px; color: var(--sub); margin-top: 4px;
    }

    /* INPUT CARD */
    .input-card {
      margin: 16px 16px 0;
      background: var(--white);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .input-card-title {
      font-size: 11px; font-weight: 700; color: var(--sub);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .input-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .input-row:last-of-type { margin-bottom: 0; }
    .input-row label {
      font-size: 13px; color: var(--sub); font-weight: 600;
      white-space: nowrap; min-width: 56px;
    }
    .input-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px; color: var(--text);
      outline: none; background: #fafafa;
    }
    .input-row input:focus { border-color: var(--purple); background: white; }
    .slots-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 0;
      border-top: 1px solid var(--border);
      margin-top: 10px;
      cursor: pointer;
    }
    .slots-toggle span { font-size: 13px; color: var(--purple); font-weight: 600; }
    .slots-arrow { font-size: 11px; color: var(--purple); transition: transform 0.2s; }
    .slots-arrow.open { transform: rotate(180deg); }
    .slots-panel { display: none; margin-top: 12px; flex-direction: column; gap: 8px; }
    .slots-panel.open { display: flex; }
    .slot-row { display: flex; align-items: center; gap: 10px; }
    .slot-row label { font-size: 12px; color: var(--sub); font-weight: 600; white-space: nowrap; min-width: 36px; }
    .slot-row input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 6px 10px; font-size: 13px; color: var(--text);
      outline: none; background: #fafafa;
    }

    /* FLOW TABS */
    .flow-tabs {
      display: flex;
      margin: 16px 16px 0;
      background: var(--white);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .flow-tab {
      flex: 1; padding: 12px 4px;
      font-size: 12px; font-weight: 700;
      text-align: center; color: var(--sub);
      cursor: pointer; border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }
    .flow-tab.active { color: var(--purple); border-bottom-color: var(--purple); }

    /* STEPS */
    .steps-wrap { padding: 16px; }
    .divider-label {
      font-size: 11px; font-weight: 700; color: var(--sub);
      letter-spacing: 0.8px; text-transform: uppercase;
      margin: 20px 0 8px 2px;
    }
    .divider-label:first-child { margin-top: 0; }
    .step-card {
      background: var(--white); border-radius: 16px;
      margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden;
    }
    .step-head {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
    }
    .step-badge {
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--purple); color: white;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .step-badge.teal { background: var(--teal); }
    .step-badge.sky  { background: #0ea5e9; }
    .step-badge.indigo { background: #4f46e5; }
    .step-info { flex: 1; }
    .step-title { font-size: 14px; font-weight: 700; color: var(--text); }
    .step-desc { font-size: 11px; color: var(--sub); margin-top: 2px; }

    /* MESSAGE */
    .msg-wrap { padding: 14px 16px; }
    .msg-label {
      display: inline-block; font-size: 10px; font-weight: 700;
      color: var(--purple); background: #f0eeff;
      border-radius: 6px; padding: 3px 10px; margin-bottom: 10px;
    }
    .msg-bubble {
      background: #f8f8fc; border: 1.5px solid #e5e3f5;
      border-radius: 12px; padding: 14px 16px;
      font-size: 13px; line-height: 1.8;
      color: var(--text); white-space: pre-wrap; word-break: break-word;
    }
    .msg-bubble a { color: #2563eb; }
    .copy-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; background: var(--purple); color: white;
      border: none; border-radius: 12px; padding: 13px;
      font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 12px;
    }
    .copy-btn.copied { background: var(--green); }

    /* ACTION */
    .action-wrap { padding: 4px 16px 14px; }
    .action-item {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 0; border-bottom: 1px solid var(--border);
    }
    .action-item:last-child { border-bottom: none; }
    .action-item input[type="checkbox"] {
      width: 22px; height: 22px; accent-color: var(--purple); flex-shrink: 0;
    }
    .action-label { flex: 1; font-size: 14px; color: var(--text); font-weight: 500; }
    .open-link {
      flex-shrink: 0; background: #f0eeff; color: var(--purple);
      border: 1.5px solid #d4cff5; border-radius: 8px;
      padding: 5px 12px; font-size: 12px; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <span class="back-btn" id="backBtn" onclick="goBack()">‹ 戻る</span>

  </div>
  <a class="logout-btn" href="/logout">ログアウト</a>

<!-- ══ HOME ══ -->

  </div>

<!-- ══ FLOW ══ -->
<div class="screen" id="screen-flow">

    <div class="flow-store-name" id="flowStoreName"></div>
  </div>

  <div class="input-card">
    <div class="input-card-title">顧客情報</div>
    <div class="input-row">
      <label>お客様名</label>
      <input type="text" id="customerName" placeholder="例：田中" oninput="renderAll()">
    </div>
    <div class="input-row">
      <label>予約日時</label>
      <input type="text" id="appointmentDate" placeholder="例：8/5(水) 14:00〜" oninput="renderAll()">
    </div>
    <div class="slots-toggle" onclick="toggleSlots()">
      <span>📅 日程候補を編集する</span>
      <span class="slots-arrow" id="slotsArrow">▼</span>
    </div>
    <div class="slots-panel" id="slotsPanel">
      <div class="slot-row"><label>候補①</label><input type="text" id="slot1" oninput="renderAll()"></div>
      <div class="slot-row"><label>候補②</label><input type="text" id="slot2" oninput="renderAll()"></div>
      <div class="slot-row"><label>候補③</label><input type="text" id="slot3" oninput="renderAll()"></div>
      <div class="slot-row"><label>候補④</label><input type="text" id="slot4" oninput="renderAll()"></div>
      <div class="slot-row"><label>候補⑤</label><input type="text" id="slot5" oninput="renderAll()"></div>
    </div>
  </div>

  <div class="flow-tabs">
    <div class="flow-tab active" onclick="switchFlow(0)">📩 お問合せ</div>
    <div class="flow-tab" onclick="switchFlow(1)">🎉 成約後</div>
    <div class="flow-tab" onclick="switchFlow(2)">💌 未成約後</div>
  </div>

  <div id="flowContent"></div>
</div>

// ──────────────────────────────────────────
// テンプレート生成

// ──────────────────────────────────────────
// 変数置換
// ──────────────────────────────────────────
function getVals(team) {
  const slotDefaults = team ? team.slots : [];
  return {
    '{名前}':   document.getElementById('customerName').value.trim() || '〇〇',
    '{日時}':   document.getElementById('appointmentDate').value.trim() || '〇/〇（曜）〇〇:00〜',
    '{候補①}': document.getElementById('slot1').value.trim() || slotDefaults[0] || '候補①',
    '{候補②}': document.getElementById('slot2').value.trim() || slotDefaults[1] || '候補②',
    '{候補③}': document.getElementById('slot3').value.trim() || slotDefaults[2] || '候補③',
    '{候補④}': document.getElementById('slot4').value.trim() || slotDefaults[3] || '候補④',
    '{候補⑤}': document.getElementById('slot5').value.trim() || slotDefaults[4] || '候補⑤',
  };
}

function sub(tmpl, team) {
  const v = getVals(team);
  return tmpl.replace(/\{[^}]+\}/g, k => v[k] ?? k);
}

function renderBubble(el, tmpl, team) {
  const escaped = sub(tmpl, team)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  el.innerHTML = escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
}

// ──────────────────────────────────────────
// ホーム
// ──────────────────────────────────────────
function buildHome() {
  const list = document.getElementById('teamList');
  list.innerHTML = TEAMS.map(t => `
    <div class="team-item" onclick="selectTeam('${t.id}')">
      <div class="team-icon" style="background:${t.color}22">${t.icon}</div>
      <div class="team-info">
        <div class="team-name">${t.name}</div>
        <div class="team-store">${t.store}</div>
      </div>
      <div class="arrow">›</div>
    </div>
  `).join('');
}

// ──────────────────────────────────────────
// チーム選択
// ──────────────────────────────────────────
function selectTeam(id) {
  currentTeam = TEAMS.find(t => t.id === id);
  currentFlow = 0;

  document.getElementById('flowTeamName').textContent = currentTeam.name;
  document.getElementById('flowStoreName').textContent = currentTeam.store;

  // スロットのデフォルト値をセット
  currentTeam.slots.forEach((s, i) => {
    const el = document.getElementById(`slot${i+1}`);
    if (el && !el.value) el.placeholder = s;
  });

  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-flow').classList.add('active');
  document.getElementById('backBtn').style.display = 'flex';
  document.querySelectorAll('.flow-tab').forEach((t,i) => t.classList.toggle('active', i === 0));
  window.scrollTo(0, 0);
  renderFlow();
}

// ──────────────────────────────────────────
// フロー切替
// ──────────────────────────────────────────
function switchFlow(i) {
  currentFlow = i;
  document.querySelectorAll('.flow-tab').forEach((t,j) => t.classList.toggle('active', i === j));
  renderFlow();
}

// ──────────────────────────────────────────
// 全メッセージ再描画
// ──────────────────────────────────────────
function renderAll() {
  if (!currentTeam) return;
  const team = currentTeam;
  const tmpls = buildTemplates(team);
  const ids = {
    m1: tmpls.inquiry.m1, m_adj: tmpls.inquiry.m_adj,
    m3: tmpls.inquiry.m3, m5: tmpls.inquiry.m5,
    s1: tmpls.contract.s1, s2a: tmpls.contract.s2a,
    s2b: tmpls.contract.s2b, s3: tmpls.contract.s3,
    u1: tmpls.nocontract.u1, u3: tmpls.nocontract.u3,
  };
  Object.entries(ids).forEach(([id, tmpl]) => {
    const el = document.getElementById(id);
    if (el) renderBubble(el, tmpl, team);
  });
}

// ──────────────────────────────────────────
// コピー
// ──────────────────────────────────────────
function copyMsg(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.nextElementSibling;
    const orig = btn.innerHTML;
    btn.innerHTML = '✅ コピーしました！';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
  });
}

// ──────────────────────────────────────────
// ナビ
// ──────────────────────────────────────────
function goBack() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('customerName').value = '';
  document.getElementById('appointmentDate').value = '';
  ['slot1','slot2','slot3','slot4','slot5'].forEach(id => { document.getElementById(id).value = ''; });
  window.scrollTo(0, 0);
}

function toggleSlots() {
  document.getElementById('slotsPanel').classList.toggle('open');
  document.getElementById('slotsArrow').classList.toggle('open');
}

// ──────────────────────────────────────────
// 初期化
// ──────────────────────────────────────────
buildHome();
</script>
